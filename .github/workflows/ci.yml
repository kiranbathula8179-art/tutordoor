name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend · flake8 + pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tutordoor
          POSTGRES_PASSWORD: tutordoor
          POSTGRES_DB: tutordoor
        ports:
          - 5432:5432
        # btree_gist is created by apps.bookings migration 0001 itself
        # (django.contrib.postgres BtreeGistExtension), so the plain image works.
        options: >-
          --health-cmd "pg_isready -U tutordoor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://tutordoor:tutordoor@localhost:5432/tutordoor
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_SETTINGS_MODULE: config.settings.dev

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Run tests
        # Celery runs eagerly under dev settings, so no worker/broker round-trips
        # are needed; Redis backs the cache/channel-layer config.
        run: pytest

  frontend:
    name: Frontend · eslint + vitest + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No package-lock.json is committed yet; the first `npm install` on a
      # machine generates one — commit it and switch this to `npm ci` for
      # reproducible installs.
      - name: Install dependencies
        run: npm install

      - name: Lint (eslint)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Type-check & build (tsc + vite)
        run: npm run build
