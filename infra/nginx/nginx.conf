worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    upstream django_wsgi {
        server backend:8000;
    }

    upstream django_asgi {
        server backend_asgi:8001;
    }

    upstream react_frontend {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name _;

        # ---- Django REST API + admin (WSGI / gunicorn) ----
        location /api/ {
            proxy_pass http://django_wsgi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://django_wsgi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- WebSockets (chat) via daphne (ASGI) ----
        location /ws/ {
            proxy_pass http://django_asgi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # ---- Django-collected static files & user media ----
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            access_log off;
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            access_log off;
        }

        # ---- React SPA (everything else) ----
        location / {
            proxy_pass http://react_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
